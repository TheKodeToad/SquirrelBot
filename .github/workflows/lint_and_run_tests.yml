name: Lint and run tests

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Install
        run: pnpm install
      - name: Run typechecker
        run: pnpm typecheck
      - name: Run linter
        run: pnpm lint
      - name: Run tests
        run: pnpm test
